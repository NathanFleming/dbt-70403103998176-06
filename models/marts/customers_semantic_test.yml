models:
  - name: customers
    semantic_model:
      enabled: true
    agg_time_dimension: first_order_date
    columns:
      - name: customer_id
        entity:
          type: primary
          name: customer_id
      - name: first_order_date
        dimension:
          type: time
    metrics:
      - name: customer_count
        type: simple
        agg: count
        expr: customer_id

saved_queries:
  - name: test_saved_query
    description: "Test saved query for DBTV2CSE-112 workaround verification"
    label: "Test Saved Query"
    query_params:
      metrics:
        - customer_count
      group_by:
        - "Dimension('customer_id__first_order_date')"